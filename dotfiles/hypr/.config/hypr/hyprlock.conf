$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    immediate_render = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    monitor =
    path = screenshot
    color = rgba(15, 15, 25, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.9
    brightness = 0.6
}

# Clock (Time)
label {
    monitor =
    text = $TIME12
    font_size = 56
    font_family = $font
    color = rgba(255, 255, 255, 1.0)
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 16
    font_family = $font
    color = rgba(255, 255, 255, 0.8)
    position = 0, 105
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.4)
}

# User Profile Icon / Avatar
label {
    monitor =
    text = 
    font_size = 32
    font_family = $font
    color = rgba(255, 255, 255, 0.9)
    position = 0, 25
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = $USER
    font_size = 15
    font_family = $font
    color = rgba(255, 255, 255, 0.9)
    position = 0, -15
    halign = center
    valign = center
}

# Password Input Field with GDM-style Incorrect Password feedback
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(20, 20, 32, 0.75)
    outer_color = rgba(255, 255, 255, 0.18)
    check_color = rgba(245, 158, 11, 0.9)
    fail_color = rgba(239, 68, 68, 1.0)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = <span foreground="##a6adc8">Password...</span>
    fail_text = <span foreground="##ef4444"><b>Incorrect password</b> ($ATTEMPTS)</span>
    fail_timeout = 2000
    fail_transition = 200
    position = 0, -85
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}

