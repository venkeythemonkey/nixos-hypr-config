$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    color = rgba(43, 48, 59, 1.0)
    blur_passes = 3
    brightness = 0.7
}

label {
    monitor =
    text = $TIME12
    font_size = 64
    font_family = $font
    color = rgba(255, 255, 255, 1.0)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 18
    font_family = $font
    color = rgba(255, 255, 255, 1.0)
    position = 0, 110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    inner_color = rgba(43, 48, 59, 0.85)
    outer_color = rgba(100, 114, 125, 1.0)
    check_color = rgba(163, 190, 140, 1.0)
    fail_color = rgba(191, 97, 106, 1.0)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = <i>Input Password...</i>
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}
