[storage]
key_source = "secret-service"

[hooks]
battery_percentage_changed = "NOCTALIA_BATTERY_THRESHOLD=20 ~/.config/noctalia/hooks/battery-threshold.sh"

[shell]
launch_apps_as_systemd_services = true
clipboard_enabled = true
polkit_agent = true
corner_radius_scale = 0.0
popup_shadows = false

[shell.panel]
shadow = false
transparency_mode = "solid"

[shell.session]
grid = false
grid_columns = 3
show_shortcuts = true

[[shell.session.actions]]
action = "command"
label = "Lock"
glyph = "lock"
command = "pidof hyprlock || hyprlock"
shortcut = "1"

[[shell.session.actions]]
action = "logout"
shortcut = "2"

[[shell.session.actions]]
action = "suspend"
shortcut = "3"

[[shell.session.actions]]
action = "reboot"
shortcut = "4"

[[shell.session.actions]]
action = "shutdown"
shortcut = "5"

[shell.screenshot]
save_to_file = true
directory = "~/Pictures/Screenshots"
filename_pattern = "Screenshot_%Y-%m-%d_%H-%M-%S"
copy_to_clipboard = true
freeze_screen = true
confirm_region = false
show_cursor = false
pipe_to_command = false
pipe_command = ""

[lockscreen]
# Hypridle and Hyprlock own session locking for this desktop.
enabled = false

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["kcolorscheme"]
